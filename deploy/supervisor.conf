[program:baiyun_api]
command=/usr/local/bin/gunicorn -c /opt/baiyun/deploy/gunicorn.conf.py "app:create_app()"
directory=/opt/baiyun/backend
user=www-data
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/baiyun_api_out.log
stderr_logfile=/var/log/supervisor/baiyun_api_err.log
environment=
    PYTHONPATH="/opt/baiyun/backend",
    DEEPSEEK_API_KEY="%(ENV_DEEPSEEK_API_KEY)s",
    REDIS_HOST="localhost",
    CACHE_ENABLED="true"

[program:baiyun_celery_worker]
command=/usr/local/bin/celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=2
directory=/opt/baiyun
user=www-data
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/baiyun_celery_out.log
stderr_logfile=/var/log/supervisor/baiyun_celery_err.log

[program:baiyun_celery_beat]
command=/usr/local/bin/celery -A backend.tasks.celery_app beat --loglevel=info
directory=/opt/baiyun
user=www-data
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/baiyun_celery_beat_out.log
stderr_logfile=/var/log/supervisor/baiyun_celery_beat_err.log
