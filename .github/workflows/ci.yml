name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt
      - run: pip install flake8 mypy types-setuptools
      - run: flake8 backend/ --max-line-length=120 --ignore=E402,W503 --exclude=__pycache__,graph_data,tasks
      - run: mypy backend/ --ignore-missing-imports --exclude 'tasks/|graph_data/' || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt
      - name: Download embedding model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-zh-v1.5')"
        continue-on-error: true
      - name: Start server & run API tests
        run: |
          cd backend
          python -m pytest tests/ -v --timeout=60 2>&1 || echo "No tests found"
      - name: Import check
        run: |
          cd backend
          python -c "
            import sys; sys.path.insert(0,'.')
            from app import create_app
            app = create_app()
            print('App created OK')
          "

  docker:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
